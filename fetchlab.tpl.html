<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Agora fetch lab</title>
<!-- Experiment page: replays one REAL Context.dev fetch ("iphone 15", real timings, logos, colours, screenshots, offers)
     in three presentations. Built by fetchlab.py from lab/data; nothing here calls the network except images. -->
<style>
:root{color-scheme:dark;--bg:#0c0f11;--panel:#151a1e;--line:#262e35;--dim:#7d8792;--ink:#e3e8ed;--good:#3fb950;--warn:#d29922}
*{box-sizing:border-box}body{font:14px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);margin:0;padding:16px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1180px;margin:0 auto 12px}h1{font-size:16px;margin:0 8px 0 0}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--good);color:var(--good)}button:focus-visible{outline:2px solid #58a6ff}
#go{background:var(--good);color:#04130a;border:0;font-weight:700}
main{max-width:1180px;margin:0 auto}.dim{color:var(--dim)}
.stats{display:flex;gap:28px;align-items:flex-end;margin:6px 0 14px;flex-wrap:wrap}
.stat b{display:block;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stat.best b{color:var(--good)}.flash{animation:flash .6s}@keyframes flash{from{text-shadow:0 0 18px var(--good);transform:scale(1.12)}}
.logo{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;flex:none;display:grid;place-items:center;font-weight:700;color:#000;font-size:13px}
.view{display:none}.view.on{display:block}
/* 1 board */
.row{display:grid;grid-template-columns:26px 190px 1fr 210px;gap:12px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel)}
.row .nm small{display:block;color:var(--dim);font-size:11px}
.bar{height:8px;border-radius:4px;background:#0b0e10;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--c);transition:width 20s cubic-bezier(.1,.7,.1,1)}
.row.wait .bar i{width:88%}.row.done .bar i{width:100%;transition:width .25s}.row.fail .bar i{width:100%;background:#5a2a2a;transition:width .25s}
.st{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.row.done .st b{color:var(--good)}.row.fail .st{color:#f85149}
.shelf{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;min-height:92px}
.chip{color:inherit;text-decoration:none;width:86px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);font-size:11px;border-bottom:3px solid var(--c)}
.chip img{width:100%;height:64px;object-fit:cover;display:block;background:#0b0e10}.chip div{padding:2px 5px;font-weight:700}
/* 2 windows */
.wins{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.win{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);position:relative}
.win .top{display:flex;gap:6px;align-items:center;padding:5px 7px;font-size:11px;border-bottom:1px solid var(--line)}.win .top .logo{width:16px;height:16px;border-radius:3px;font-size:9px}
.win .top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.win .top em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
.shot{aspect-ratio:16/10;background:linear-gradient(100deg,#11161a 40%,#1b2228 50%,#11161a 60%) 0 0/200% 100%;animation:sk 1.2s linear infinite;position:relative;overflow:hidden}
@keyframes sk{to{background-position:-200% 0}}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;filter:blur(8px);transition:opacity .5s,filter .7s;display:block}
.win.done .shot{animation:none}.win.done .shot img{opacity:1;filter:none}
.win.done .shot::after{content:"";position:absolute;left:0;right:0;height:26%;top:-26%;background:linear-gradient(transparent,var(--c));opacity:.55;animation:scan .9s ease-in forwards}
@keyframes scan{to{top:100%}}
.win .tag{position:absolute;right:6px;bottom:6px;background:#000c;border:1px solid var(--c);border-radius:10px;padding:1px 8px;font-size:11px;opacity:0;transition:opacity .3s .7s}.win.done .tag{opacity:1}
.win.fail .shot{animation:none;display:grid;place-items:center;color:#f85149;font-size:12px}
/* 3 ladder */
.sitebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 9px 3px 4px;font-size:11px;opacity:.45;transition:opacity .3s,border-color .3s}.pill .logo{width:18px;height:18px;border-radius:9px;font-size:9px}
.pill.done{opacity:1;border-color:var(--c)}.pill.wait .logo{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.3}}
.ladder{position:relative;height:540px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;touch-action:none}
.col{position:absolute;top:0;bottom:0;width:33.33%;border-left:1px dashed var(--line)}.col h3{margin:6px 0 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:400}
.tick{position:absolute;left:0;right:0;border-top:1px solid #1d242a;font-size:10px;color:var(--dim);padding-left:4px;pointer-events:none}
.dot{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid var(--c);background:#0b0e10 center/cover;transition:box-shadow .2s,opacity .3s;animation:drop .7s both cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(calc(-1*var(--y) - 60px));opacity:0}}
.dot.under{box-shadow:0 0 0 3px var(--good),0 0 14px var(--good);z-index:2}.dot:hover{z-index:5;transform:scale(1.6)}
.mine{position:absolute;left:0;right:0;height:22px;margin-top:-11px;cursor:ns-resize;z-index:6}.mine::before{content:"";position:absolute;left:0;right:0;top:10px;border-top:2px dashed var(--good)}
.mine span{position:absolute;right:8px;top:-9px;background:var(--good);color:#04130a;border-radius:4px;padding:1px 8px;font-weight:700;font-size:12px}
.note{color:var(--dim);font-size:12px;margin-top:10px;max-width:900px}
@media(max-width:800px){.wins{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:26px 1fr 110px}.row .bar{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><h1>fetch lab</h1>
<button data-v=board aria-pressed=true>1 Board</button><button data-v=wins aria-pressed=false>2 Windows</button><button data-v=ladder aria-pressed=false>3 Ladder</button>
<button id=go>Replay</button><label class=dim>speed <select id=speed><option value=1>real</option><option value=2 selected>2x</option><option value=4>4x</option></select></label>
<span class=dim id=clock></span></header>
<main>
<div class=stats><div class="stat best"><b id=best>—</b><span>best price so far</span></div><div class=stat><b id=nsite>0</b><span>sites answered</span></div>
<div class=stat><b id=noff>0</b><span>real offers</span></div><div class=stat><b id=ndrop>0</b><span>thrown out by judge</span></div><div class=stat><b id=secs>0.0</b><span>seconds</span></div></div>
<section class="view on" id=board><div id=rows></div><div class=shelf id=shelf1 aria-label="Cheapest offers so far"></div></section>
<section class=view id=wins><div class=wins id=tiles></div><div class=shelf id=shelf2 aria-label="Cheapest offers so far"></div></section>
<section class=view id=ladder><div class=sitebar id=pills></div><div class=ladder id=lad></div>
<div class=note id=under></div></section>
<p class=note id=about></p>
</main>
<script>
const DATA=/*DATA*/;
const $=id=>document.getElementById(id),el=(t,c,x)=>{const d=document.createElement(t);if(c)d.className=c;if(x!=null)d.textContent=x;return d};
const eur=o=>o.price*(DATA.rates[o.currency]||1),fmt=n=>'€'+Math.round(n);
const S=DATA.sites;let view='board',timers=[],t0=0,raf=0,speed=2,landed=[],offers=[],best=null,dropped=0,mine=null;
function logo(s,cls){if(s.logo){const i=el('img',cls||'logo');i.src=s.logo;i.alt='';i.referrerPolicy='no-referrer';i.onerror=()=>i.replaceWith(mono(s,cls));return i}return mono(s,cls)}
function mono(s,cls){const d=el('div',cls||'logo',s.name[0].toUpperCase());d.style.background=s.color;d.style.color='#fff';return d}
// FLIP: remember where things are, change the DOM, then slide them from the old place to the new one
function flip(nodes,from,change){const first=new Map(nodes.map(n=>[n,n.getBoundingClientRect()]));change();
  [...first.keys(),...from.keys()].forEach(n=>{if(!n.isConnected)return;const a=from.get(n)||first.get(n),b=n.getBoundingClientRect();
    const dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy)return;
    n.animate([{transform:`translate(${dx}px,${dy}px) scale(${from.has(n)?.4:1})`,opacity:from.has(n)?0.2:1},{transform:'none',opacity:1}],{duration:from.has(n)?650:380,easing:'cubic-bezier(.2,.8,.2,1)'})})}
function chip(o,s){const c=el('a','chip');c.href=o.url;c.target='_blank';c.rel='noopener noreferrer';c.title=o.title+' · '+s.name;c.style.setProperty('--c',s.color);
  const i=el('img');i.alt='';i.loading='lazy';i.referrerPolicy='no-referrer';i.onerror=()=>{i.style.visibility='hidden'};if(o.image)i.src=o.image;else i.style.visibility='hidden';c.append(i,el('div','',fmt(eur(o))));c._o=o;return c}
function shelf(box,s,origin){const top=offers.slice().sort((a,b)=>eur(a.o)-eur(b.o)).slice(0,11),from=new Map(),old=[...box.children];
  flip(old,from,()=>{old.forEach(c=>{if(!top.some(t=>t.o===c._o))c.remove()});
    top.forEach((t,i)=>{let c=[...box.children].find(c=>c._o===t.o);if(!c){c=chip(t.o,t.s);if(origin)from.set(c,origin.getBoundingClientRect())}
      if(box.children[i]!==c)box.insertBefore(c,box.children[i]||null)})})}
function count(node,to,f){const from=node._v??to;node._v=to;const t=performance.now();node.classList.remove('flash');void node.offsetWidth;node.classList.add('flash');
  (function step(n){const k=Math.min(1,(n-t)/500);node.textContent=f(from+(to-from)*k);if(k<1)requestAnimationFrame(step)})(t)}
const V={
 board:{init(){$('rows').textContent='';$('shelf1').textContent='';S.forEach(s=>{const r=el('div','row wait');r.style.setProperty('--c',s.color);s._row=r;
     const nm=el('div','nm',s.name);nm.append(el('small','',s.country+' · '+s.kind));const bar=el('div','bar');bar.append(el('i'));s._st=el('div','st','0.0 s');
     r.append(logo(s),nm,bar,s._st);$('rows').append(r)});requestAnimationFrame(()=>S.forEach(s=>s._row.querySelector('i').style.width=''))},
   tick(t){S.forEach(s=>{if(!s._done)s._st.textContent=t.toFixed(1)+' s'})},
   land(s,kept){s._row.className='row '+(s.ok?'done':'fail');s._st.textContent='';
     if(s.ok){const b=el('b','',kept.length+' offers');s._st.append(b,kept.length?' · from '+fmt(Math.min(...kept.map(eur))):'',el('span','dim','  '+s.secs+' s'))}else s._st.textContent='no answer · '+s.secs+' s';
     const key=x=>x._done?(x.ok&&x._min!=null?x._min:1e8):1e9,rows=[...$('rows').children];
     flip(rows,new Map(),()=>S.slice().sort((a,b)=>key(a)-key(b)).forEach(x=>$('rows').append(x._row)));shelf($('shelf1'),s,s._row)}},
 wins:{init(){$('tiles').textContent='';$('shelf2').textContent='';S.forEach(s=>{const w=el('div','win');w.style.setProperty('--c',s.color);s._win=w;
     const top=el('div','top');s._ms=el('em','','0.0 s');top.append(logo(s),el('span','',s.domain),s._ms);const sh=el('div','shot');
     if(s.shot){const i=el('img');i.alt='Screenshot of '+s.domain;i.src=s.shot;sh.append(i)}s._tag=el('div','tag');w.append(top,sh,s._tag);$('tiles').append(w)})},
   tick(t){S.forEach(s=>{if(!s._done)s._ms.textContent=t.toFixed(1)+' s'})},
   land(s,kept){s._ms.textContent=s.secs+' s';if(!s.ok){s._win.classList.add('fail');s._win.querySelector('.shot').textContent='no answer';return}
     s._win.classList.add('done');s._tag.textContent=kept.length+' offers';setTimeout(()=>shelf($('shelf2'),s,s._win),700/speed)}},
 ladder:{init(){$('pills').textContent='';const L=$('lad');L.textContent='';const all=S.flatMap(s=>s.rows.filter(o=>o.keep).map(eur));
     this.lo=Math.log(Math.min(...all)*.9);this.hi=Math.log(Math.max(...all)*1.1);
     ['used','refurbished','new'].forEach((k,i)=>{const c=el('div','col');c.style.left=i*33.33+'%';c.append(el('h3','',k));L.append(c)});
     [100,150,200,300,400,500,700,1000,1500].forEach(p=>{const y=this.y(p);if(y>12&&y<530){const t=el('div','tick',fmt(p));t.style.top=y+'px';L.append(t)}});
     S.forEach(s=>{const p=el('div','pill wait');p.style.setProperty('--c',s.color);p.append(logo(s),s.name);s._pill=p;$('pills').append(p)});
     mine=el('div','mine');mine.tabIndex=0;mine.setAttribute('role','slider');mine.setAttribute('aria-label','Your price');mine.append(el('span'));L.append(mine);this.price(mine._p||350);
     const move=e=>{const r=L.getBoundingClientRect();this.price(Math.exp(this.hi-(Math.min(r.height,Math.max(0,e.clientY-r.top))/r.height)*(this.hi-this.lo)))};
     mine.onpointerdown=e=>{mine.setPointerCapture(e.pointerId);mine.onpointermove=move};mine.onpointerup=()=>mine.onpointermove=null;
     mine.onkeydown=e=>{if(e.key=='ArrowUp')this.price(mine._p*1.03);if(e.key=='ArrowDown')this.price(mine._p/1.03)}},
   y(p){return (this.hi-Math.log(p))/(this.hi-this.lo)*540},
   price(p){mine._p=p;mine.style.top=this.y(p)+'px';mine.firstChild.textContent='your price '+fmt(p);mine.setAttribute('aria-valuenow',Math.round(p));
     const d=[...$('lad').querySelectorAll('.dot')];d.forEach(n=>n.classList.toggle('under',n._e<=p));
     $('under').textContent=d.filter(n=>n._e<=p).length+' of '+d.length+' offers are at or under your price. Drag the green line (or focus it and use the arrow keys). In the product, an empty zone under the line means the agent keeps watching and pings you when a listing lands there.'},
   tick(){},
   land(s,kept){s._pill.className='pill '+(s.ok?'done':'');const col=['used','refurbished','new'].indexOf(s.kind=='comparison'?'new':s.kind),W=$('lad').clientWidth/3;
     kept.forEach((o,i)=>{const d=el('a','dot');d.href=o.url;d.target='_blank';d.rel='noopener noreferrer';d._e=eur(o);const y=this.y(d._e);
       let h=0;for(const ch of o.url)h=(h*31+ch.charCodeAt(0))>>>0;
       d.style.cssText=`left:${col*W+30+(h%1000)/1000*(W-60)}px;top:${y}px;--y:${y}px;--c:${s.color};animation-delay:${i*40}ms;`+(o.image?`background-image:url("${o.image.replace(/"/g,'%22')}")`:'');
       d.title=fmt(d._e)+' · '+o.title+' · '+s.name;d.setAttribute('aria-label',d.title);$('lad').append(d)});this.price(mine._p)}}};
function play(){timers.forEach(clearTimeout);cancelAnimationFrame(raf);timers=[];landed=[];offers=[];best=null;dropped=0;speed=+$('speed').value;
  S.forEach(s=>{s._done=false;s._min=null});['nsite','noff','ndrop'].forEach(i=>{$(i).textContent='0';$(i)._v=0});$('best').textContent='—';$('best')._v=undefined;
  V[view].init();t0=performance.now();const end=Math.max(...S.map(s=>s.secs));
  (function tick(){const t=Math.min(end,(performance.now()-t0)/1000*speed);$('secs').textContent=t.toFixed(1);V[view].tick(t);if(t<end)raf=requestAnimationFrame(tick)})();
  S.forEach(s=>timers.push(setTimeout(()=>{s._done=true;const kept=s.rows.filter(o=>o.keep);dropped+=s.rows.length-kept.length;
    kept.forEach(o=>offers.push({o,s}));if(kept.length)s._min=Math.min(...kept.map(eur));landed.push(s);
    count($('nsite'),landed.length,n=>Math.round(n)+'/'+S.length);count($('noff'),offers.length,n=>Math.round(n));count($('ndrop'),dropped,n=>Math.round(n));
    if(s._min!=null&&(best==null||s._min<best)){best=s._min;count($('best'),best,fmt)}
    V[view].land(s,kept)},s.secs*1000/speed)))}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===view));play()});
$('go').onclick=play;$('speed').onchange=play;
$('about').textContent='Recorded '+DATA.when+': one Context.dev request per site for "'+DATA.query+'" (text + HTML + screenshot together), logos and colours from the Context.dev brand lookup, relevance from the Gemini Decisions judge. Timings are the real ones. Other currencies are shown in euro at rough fixed rates.';
play();
</script>
