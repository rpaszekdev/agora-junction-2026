<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agora guide</title>
    <style>
      :root { --paper: #fff9ee; --ink: #1b1b1b; --yellow: #f7c52b; --blue: #3e6fd0; --red: #e23b2e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--paper); color: var(--ink); font: 16px/1.3 "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive; }
      canvas { position: fixed; inset: 0; display: block; }
      button, input { font: inherit; color: inherit; }
      .sk { border: 2.5px solid var(--ink); border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; background: #fff; }
      :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
      #status { position: fixed; top: 16px; left: 16px; padding: 6px 14px; font-size: 14px; letter-spacing: 0.5px; }
      #words { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); min-height: 1.3em;
        text-align: center; font-size: 20px; text-wrap: balance; padding: 6px 12px; border-radius: 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
      #words:empty { display: none; }
      #words.you { opacity: 0.6; }
      #bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 10px; width: min(640px, calc(100vw - 32px)); }
      #talk { padding: 12px 22px; background: var(--yellow); cursor: pointer; white-space: nowrap; transition: transform 0.12s; }
      #talk:hover { transform: rotate(-2deg) scale(1.03); }
      #talk[aria-pressed="true"] { background: #fff; }
      #text { flex: 1; min-width: 0; padding: 12px 16px; }
      .pick { position: fixed; left: 0; top: 0; width: 132px; padding: 8px; text-align: center; text-decoration: none; color: inherit; font-size: 13px; line-height: 1.15;
        border-radius: 50% 46% 52% 48% / 48% 52% 46% 50%; box-shadow: 4px 5px 0 var(--ink); opacity: 0; transition: opacity 0.25s, scale 0.25s cubic-bezier(0.2, 1.4, 0.4, 1); scale: 0.4; will-change: transform; }
      .pick.on { opacity: 1; scale: 1; }
      .pick:hover { background: var(--yellow); z-index: 2; }
      .pick img { display: block; width: 72px; height: 72px; margin: 0 auto 2px; object-fit: contain; }
      .pick b { display: block; font-size: 17px; }
      .pick i { display: block; font-style: normal; opacity: 0.7; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="status" class="sk" role="status" aria-live="polite">LOADING</div>
    <div id="picks" aria-label="The guide's picks"></div>
    <div id="words" aria-live="polite"></div>
    <form id="bar">
      <button id="talk" class="sk" type="button" aria-pressed="false">TALK TO THE GUIDE</button>
      <input id="text" class="sk" autocomplete="off" maxlength="500" placeholder="…or type what you are looking for" aria-label="Message to the guide" />
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
