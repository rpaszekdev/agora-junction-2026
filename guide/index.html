<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agora guide</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      /* The look is Albert's (albertmajor/apartment-ps1, src/style.css), the same as the wall's (../wall.html):
         linen, hairlines, system type, one accent. The words the script writes in capitals are small quiet labels. */
      /* Albert's PriceMonkey palette (agora/web/css/base.css), the same tokens as the wall's (../wall.html), so in its frame she stands on
         the wall's own paper. No --stage here: this page uses that name for her share of the width */
      :root { --paper: #f4f1ea; --card: #fbf9f4; --field: #fffdf8; --tile: #e8e3d8; --ink: #1c1b18; --ink-2: #5e5a52; --ink-3: #9a948a;
        --muted: #5e5a52; --line: rgba(28, 27, 24, 0.12); --accent: #f0d435; --accent-fg: #1c1b18; --green: #2f6b4f; --bad: #b3261e;
        --shadow: 0 10px 30px rgba(40, 30, 20, 0.12); --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
      /* the wall's dark mode, when she stands inside its page */
      :root.dark { color-scheme: dark; --paper: #161513; --card: #211f1b; --field: #1e1c19; --tile: #22201c; --ink: #eeeae1; --ink-2: #b5afa4;
        --ink-3: #8a8478; --muted: #b5afa4; --line: rgba(238, 234, 225, 0.12); --green: #5fa683; --bad: #e5594f; --shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font); }
      /* she stands on the right (her share of the width is STAGE in src/main.ts); the search is on the left */
      :root { --stage: 40vw; }
      canvas { position: fixed; top: 0; right: 0; display: block; }
      #board { position: fixed; inset: 0 var(--stage) 0 0; padding: 16px 12px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      button, input { font: inherit; color: inherit; }
      .sk { border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      #status, .chip, .count, .log .head { font-size: 11px; font-weight: 650; letter-spacing: 0.06em; color: var(--muted); }
      #status { align-self: flex-start; padding: 4px 10px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chips:empty, .count:empty, .tape:empty { display: none; }
      .chip { padding: 3px 10px; border-radius: 999px; }
      button.chip { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); cursor: pointer; }
      button.chip[aria-pressed="false"] { background: transparent; border-color: var(--line); color: var(--muted); text-decoration: line-through; }
      .log { padding: 12px 14px; font-size: 12px; border-radius: 14px; }
      .log .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 8px; }
      .log ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 14px; }
      .log li { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .log li b { white-space: nowrap; font-weight: 600; }
      .log .st { color: var(--muted); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .log li.ok .st { color: var(--green); }
      .log li.no .st { color: var(--bad); }
      .lg { flex: none; width: 20px; height: 20px; display: grid; place-items: center; overflow: hidden; font-size: 9px; background: #fff; color: #2e2a25; border: 1px solid var(--line); border-radius: 5px; }
      .lg img { width: 100%; height: 100%; object-fit: contain; }
      .tape { margin-top: 8px; font: 11px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 0 6px 8px 0; }
      .card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px; text-align: center; text-decoration: none; color: inherit;
        font-size: 12px; line-height: 1.3; border-radius: 14px; background: var(--tile); transition: transform 0.15s ease, box-shadow 0.15s; }
      .card[hidden] { display: none; }
      .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .card .ph { width: 100%; height: 96px; display: grid; place-items: center; }
      .card .ph[hidden] { display: none; }
      .card .ph img { max-width: 100%; max-height: 96px; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(40, 30, 20, 0.2)); }
      .card b { font: 600 13px var(--mono); }
      .card i { font-style: normal; color: var(--muted); }
      .card .why { display: none; font-style: normal; }
      .card.pick { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
      .card.pick .why { display: block; margin-top: 4px; padding: 1px 9px; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-fg); border-radius: 999px; }
      #words { position: fixed; left: calc(100vw - var(--stage) + 12px); right: 12px; bottom: 84px; min-height: 1.3em;
        text-align: center; font-size: 17px; font-weight: 500; text-wrap: balance; padding: 6px 12px; border-radius: 12px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
      #words:empty { display: none; }
      #words.you { color: var(--muted); }
      #bar { position: fixed; left: calc(100vw - var(--stage) + 12px); right: 12px; bottom: 24px; display: flex; gap: 8px; }
      #talk { padding: 9px 18px; background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; white-space: nowrap; transition: filter 0.15s; }
      #talk:hover { filter: brightness(1.07); }
      #talk[aria-pressed="true"] { background: var(--card); border-color: var(--line); color: var(--ink); }
      #text { flex: 1; min-width: 0; padding: 9px 14px; }
      #text::placeholder { color: var(--ink-3); }
      /* ?embed: a frame inside the wall's page, which shows the search itself. Here: she, her status, the bar */
      body.embed { --stage: 100vw; }
      body.embed #board { inset: 0 0 auto 0; padding: 10px; overflow: visible; }
      body.embed #status { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0; border: 0; background: none; font-size: 10px; }
      /* the wall's right side (../wall.html, #guide: the top 80% of the window): he stands large, and under him one chat box */
      body.embed { --box: max(16px, calc(50% - 215px)); }
      body.embed #words { left: var(--box); right: var(--box); bottom: calc(6vh + 70px); font-size: 13px; padding: 2px 8px; }
      /* the same box as the wall's search (#ask there): field paper, one hairline, an ink ring on focus, the arrow at the end */
      body.embed #bar { left: var(--box); right: var(--box); bottom: 6vh; gap: 6px; align-items: center; height: 60px; padding: 0 6px 0 8px;
        border: 1px solid var(--line); border-radius: 16px; background: var(--field); box-shadow: 0 1px 0 rgba(28, 27, 24, 0.04);
        transition: border-color 0.16s, box-shadow 0.16s; }
      body.embed #bar:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 4px var(--line); }
      body.embed #talk { padding: 7px 14px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink-2); }
      body.embed #talk:hover { color: var(--ink); border-color: var(--ink-3); filter: none; }
      body.embed #talk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      body.embed #text { padding: 8px 4px; font-size: 16px; border: 0; background: none; }
      #send { display: none; }
      body.embed #send { display: block; flex: none; height: 48px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: none;
        color: var(--ink-2); font: 20px/1 var(--font); cursor: pointer; transition: color 0.16s; }
      body.embed #send:hover, body.embed #bar:focus-within #send { color: var(--ink); }
      body.embed #text:focus-visible { outline: 0; }
      /* ?who=monkey (src/monkey.ts): the picture stands in the middle of her part of the window, above the words */
      #monkey { position: fixed; left: calc(100vw - var(--stage) / 2); bottom: 120px; translate: -50% 0; transform-origin: 50% 100%; pointer-events: none; }
      #monkey img { display: block; height: calc(100vh - 180px); width: auto; }
      #monkey .mouth { position: absolute; translate: 0 -50%; border-radius: 50%; background: #1f1b0f; }
      body.embed #monkey { bottom: 30vh; }
      body.embed #monkey img { height: 44vh; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="board" aria-label="The search">
      <div id="status" class="sk" role="status" aria-live="polite">LOADING</div>
    </div>
    <div id="words" aria-live="polite"></div>
    <form id="bar">
      <button id="talk" class="sk" type="button" aria-pressed="false">Talk to the guide</button>
      <input id="text" class="sk" autocomplete="off" maxlength="500" placeholder="…or type what you are looking for" aria-label="Message to the guide" />
      <button id="send" type="submit" aria-label="Send"><span aria-hidden="true">→</span></button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
