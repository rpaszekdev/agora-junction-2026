<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agora guide</title>
    <style>
      :root { --paper: #fff9ee; --ink: #1b1b1b; --card: #fff; --yellow: #f7c52b; --blue: #3e6fd0; --red: #e23b2e; }
      :root.dark { --paper: #17161c; --ink: #f4ecdc; --card: #26242e; } /* the wall's dark mode, when she stands inside its page */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--paper); color: var(--ink); font: 16px/1.3 "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive; }
      /* she stands on the right (her share of the width is STAGE in src/main.ts); the search is on the left */
      :root { --stage: 40vw; }
      canvas { position: fixed; top: 0; right: 0; display: block; }
      #board { position: fixed; inset: 0 var(--stage) 0 0; padding: 16px 12px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      button, input { font: inherit; color: inherit; }
      .sk { border: 2.5px solid var(--ink); border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; background: var(--card); }
      :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
      #status { align-self: flex-start; padding: 6px 14px; font-size: 14px; letter-spacing: 0.5px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chips:empty, .count:empty, .tape:empty { display: none; }
      .chip { padding: 4px 12px; font-size: 14px; letter-spacing: 0.5px; }
      button.chip { background: var(--yellow); cursor: pointer; }
      button.chip[aria-pressed="false"] { background: #fff; text-decoration: line-through; opacity: 0.7; }
      .log { padding: 10px 14px; font-size: 13px; border-radius: 14px; }
      .log .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; letter-spacing: 0.5px; }
      .log ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 3px 14px; }
      .log li { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .log li b { white-space: nowrap; }
      .log .st { opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .log li.ok .st { color: #1c7a3a; opacity: 1; }
      .log li.no .st { color: var(--red); opacity: 1; }
      .lg { flex: none; width: 20px; height: 20px; display: grid; place-items: center; overflow: hidden; font-size: 10px; background: #fff; border: 1.5px solid var(--ink); border-radius: 5px; }
      .lg img { width: 100%; height: 100%; object-fit: contain; }
      .tape { margin-top: 6px; font: 11px/1.3 ui-monospace, Menlo, monospace; opacity: 0.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .count { font-size: 15px; letter-spacing: 0.5px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 6px 8px 0; }
      .card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px; text-align: center; text-decoration: none; color: inherit;
        font-size: 13px; line-height: 1.15; border-radius: 16px; box-shadow: 3px 4px 0 var(--ink); transition: transform 0.12s; }
      .card[hidden] { display: none; }
      .card:hover { transform: translate(-1px, -2px) rotate(-0.6deg); background: var(--yellow); }
      .card .ph { width: 100%; height: 96px; display: grid; place-items: center; }
      .card .ph[hidden] { display: none; }
      .card .ph img { max-width: 100%; max-height: 96px; object-fit: contain; }
      .card b { font-size: 17px; }
      .card i { font-style: normal; opacity: 0.7; }
      .card .why { display: none; font-style: normal; }
      .card.pick { background: var(--yellow); box-shadow: 5px 6px 0 var(--ink); }
      .card.pick .why { display: block; margin-top: 3px; padding: 1px 8px; font-size: 12px; background: #fff; border: 1.5px solid var(--ink); border-radius: 10px; }
      #words { position: fixed; left: calc(100vw - var(--stage) + 12px); right: 12px; bottom: 96px; min-height: 1.3em;
        text-align: center; font-size: 20px; text-wrap: balance; padding: 6px 12px; border-radius: 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
      #words:empty { display: none; }
      #words.you { opacity: 0.6; }
      #bar { position: fixed; left: calc(100vw - var(--stage) + 12px); right: 12px; bottom: 24px; display: flex; gap: 10px; }
      #talk { padding: 12px 22px; background: var(--yellow); color: #1b1b1b; cursor: pointer; white-space: nowrap; transition: transform 0.12s; }
      #talk:hover { transform: rotate(-2deg) scale(1.03); }
      #talk[aria-pressed="true"] { background: var(--card); color: var(--ink); }
      #text { flex: 1; min-width: 0; padding: 12px 16px; }
      /* ?embed: a frame inside the wall's page, which shows the search itself. Here: she, her status, the bar */
      body.embed { --stage: 100vw; }
      body.embed #board { inset: 0 0 auto 0; padding: 8px; overflow: visible; }
      body.embed #status { max-width: 100%; padding: 4px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      body.embed #words { bottom: 62px; font-size: 15px; padding: 4px 8px; }
      body.embed #bar { bottom: 10px; gap: 6px; }
      body.embed #talk, body.embed #text { padding: 8px 12px; font-size: 14px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="board" aria-label="The search">
      <div id="status" class="sk" role="status" aria-live="polite">LOADING</div>
    </div>
    <div id="words" aria-live="polite"></div>
    <form id="bar">
      <button id="talk" class="sk" type="button" aria-pressed="false">TALK TO THE GUIDE</button>
      <input id="text" class="sk" autocomplete="off" maxlength="500" placeholder="…or type what you are looking for" aria-label="Message to the guide" />
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
