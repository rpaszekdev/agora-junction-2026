<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Agora</title>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel=stylesheet href="/web/css/line.css">
<link rel=stylesheet href="/web/css/livelog.css">
<script>try{var t=localStorage.getItem('agora-theme');if(t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
/* The palette and type are Albert's PriceMonkey (albertmajor/junction-2026-agora, agora/web/css/base.css): warm paper, hairlines,
   banana yellow for the pick, Fraunces / Instrument Sans / IBM Plex Mono. His price line (web/) uses his token names; ours alias them. */
:root{--log:0px;--paper:#F4F1EA;--stage:#E8E3D8;--receipt:#FBF9F4;--ink:#1C1B18;--ink-2:#5E5A52;--ink-3:#9A948A;--hair:rgba(28,27,24,.12);--accent:#F0D435;--accent-fg:#1C1B18;
 --flag:#B4532A;--ok:#2F6B4F;--alarm:#B3261E;--live:#D9480F;--paper-2:#EDE8DD;--field:#FFFDF8;
 --serif:"Fraunces","Iowan Old Style",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --ease:cubic-bezier(.2,.7,.2,1);--t-ui:160ms;--t-drop:450ms;--t-turn:900ms;--r-sheet:12px;--r-pill:999px;--line-h:340px;
 --card:var(--receipt);--tile:var(--stage);--muted:var(--ink-2);--line:var(--hair);--green:var(--ok);--bad:var(--alarm);--font:var(--sans);
 --radius:14px;--shadow:0 10px 30px rgba(40,30,20,.12)}
:root.dark{color-scheme:dark;--paper:#161513;--stage:#22201C;--receipt:#211F1B;--ink:#EEEAE1;--ink-2:#B5AFA4;--ink-3:#8A8478;--hair:rgba(238,234,225,.12);--field:#1E1C19;
 --flag:#D9774E;--ok:#5FA683;--alarm:#E5594F;--live:#FF7A45;--paper-2:#1D1B18;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:14px/1.45 var(--font);color:var(--ink);background:var(--paper)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
.sk{border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.label,#drop li.note,#log::before{font:650 11px/1.4 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

header{position:sticky;top:0;z-index:30;display:flex;justify-content:center;align-items:flex-start;gap:14px;padding:14px calc(var(--log) + 24px) 10px 24px;background:var(--paper)}
body.focus header{background:none}
#logo{position:absolute;left:24px;top:22px;font:italic 400 27px/1 var(--serif);letter-spacing:-.01em;color:var(--ink);text-decoration:none}
#ask{position:relative;width:min(720px,calc(100% - 220px));transition:width .2s cubic-bezier(.2,.8,.2,1)}
body.focus #ask{width:min(900px,calc(100% - 220px))}
.bar{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 16px;border-radius:var(--radius);box-shadow:0 1px 0 rgba(28,27,24,.04)}
.sk.bar{background:var(--field);border-color:var(--hair)}
/* the start screen: the bar is the page's one big thing, a fifth of the way down; it scrolls up to the top and stays there.
   A search puts it back at the top, small, so the results get the height */
header{transition:padding .35s cubic-bezier(.2,.8,.2,1)}.bar{transition:height .2s,border-radius .2s}
body.home header{padding-top:11vh;top:calc(14px - 11vh)}
#ask{width:min(520px,calc(100% - 330px))}body.home #ask{width:min(640px,calc(100% - 48px))}body.focus #ask{width:min(900px,calc(100% - 330px))}
body.home .bar{height:60px;padding:0 6px 0 20px;border-radius:16px}body.home #q{font-size:18px}
/* his start screen (albert agora/web/css/base.css): one calm group, the question, the box, the examples, then his shelf on the line */
body.home header{flex-wrap:wrap}body.home #filt,body.home #wall{display:none}body.home #line.ln{margin-top:8px}
#hello,#chips{display:none}
body.home #hello{display:block;flex-basis:100%;margin:0 0 18px;text-align:center;font:400 64px/1.02 var(--serif);letter-spacing:-.02em;text-wrap:balance}
#hello em{font-style:italic;font-variation-settings:"opsz" 96,"SOFT" 100,"WONK" 1;padding-right:.04em}
body.home #chips{display:flex;flex-basis:100%;justify-content:center;flex-wrap:wrap;gap:10px}
#chips button{padding:7px 14px;border:1px solid var(--hair);border-radius:var(--r-pill);font-size:13px;color:var(--ink-2);transition:color .15s,border-color .15s,background .15s}
#chips button:hover,#chips button:focus-visible{color:var(--ink);border-color:var(--ink-3);background:var(--receipt)}
@media(max-width:700px){body.home #hello{font-size:44px}}
/* Filters, beside the bar: it opens the results' filter row (kind, highest price, country, shipping, order), which is closed
   until asked for. Dimmed on the start screen, where there is nothing to filter; the dot says a filter is on while the row is closed */
#filt{height:48px;padding:0 18px;border-radius:var(--radius);font-weight:600;box-shadow:0 2px 10px rgba(40,30,20,.06)}
body.home #filt{height:52px;border-radius:16px;opacity:.45;pointer-events:none}
#filt[aria-expanded=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
body:has(#max:not(:placeholder-shown),#ships[aria-pressed=true]) #filt::after{content:" •";color:var(--accent)}
body:not(.filters) #tabs,body:not(.filters) #tools{display:none}
@media(min-width:701px){body.home #logo,body.home #logbtn{position:fixed}} /* they stay in their corners while the tall header scrolls away */
.bar:focus-within{border-color:var(--ink-3);box-shadow:0 0 0 4px var(--hair)}
#go{flex:none;height:40px;min-width:40px;padding:0 10px;font:20px/1 var(--sans);color:var(--ink-2);border-radius:10px;transition:color .15s}
#go:hover,.bar:focus-within #go{color:var(--ink)}body.home #go{height:52px;padding:0 16px}
#q{flex:1;min-width:0;height:100%;font-size:16px;background:none;border:0}
#q::placeholder{color:var(--muted)}#q:focus-visible{outline:0}
#clear{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:12px}
#panel{position:absolute;inset:calc(100% + 6px) 0 auto 0;display:flex;flex-direction:column;padding:6px 6px 10px;border-radius:var(--radius);box-shadow:var(--shadow);animation:rise .12s ease-out}
#drop{flex:1;min-height:30vh;max-height:60vh;overflow-y:auto;margin:0;padding:0;list-style:none}
#drop li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer}
#drop li[aria-selected=true],#drop li:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#drop li.sep{height:0;padding:0;margin:6px 10px;border-top:1px solid var(--line);cursor:default}
#drop li.note{cursor:default;background:none}
#drop kbd{margin-left:auto;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font:600 11px/1.5 var(--mono)}
#mode{align-self:center;display:flex;gap:4px;margin-top:10px;white-space:nowrap}
#mode button{min-width:150px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;font-weight:600;transition:background .15s}
#mode button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
body.ai #drop{min-height:44vh;padding:6px}
#drop li.agent,#drop li.me{align-items:flex-start;font-size:15px;cursor:default;background:none}
#drop li.me{justify-content:flex-end}#drop li.agent span,#drop li.me span{white-space:pre-wrap}#drop li.me span:empty,#drop li.agent span:empty{display:none}#drop li.me span{padding:6px 12px;border-radius:12px 12px 3px 12px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
#drop li.go{position:sticky;bottom:0;margin-top:10px;background:var(--accent);color:var(--accent-fg)}
#drop li.go b{font-weight:600}#drop li.go kbd{border-color:color-mix(in srgb,var(--accent-fg) 45%,transparent)}
#drop .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font:11px var(--mono)}
#drop .chips span{padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
#drop li.wait .chips{animation:blink 1.2s ease-in-out infinite}
#dim{position:fixed;inset:0;z-index:25;background:rgba(30,26,22,.45);animation:fade .15s ease-out}
#logbtn{position:absolute;right:calc(var(--log) + 24px);top:22px;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 6px;font-size:13px;font-weight:600;cursor:pointer}
#logbtn img{display:block;width:20px;height:20px}#logbtn[aria-pressed=false]{color:var(--muted)}#logbtn[aria-pressed=false] img{opacity:.6}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}}@keyframes fade{from{opacity:0}}

/* one centred board, the same for the results' head and the products: the paper left and right of it stays empty */
:root{--board:min(800px,calc(100% - var(--log) - 96px))}
#res,#line,#wall{width:var(--board);margin-left:calc((100% - var(--log) - var(--board))/2)}
#res{padding:6px 0 0}
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#title{flex:1;min-width:200px;margin:0;font-size:20px;font-weight:650;line-height:1.2;letter-spacing:-.01em}
#tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
#tabs button{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:650;letter-spacing:.05em;color:var(--muted)}#tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.14)}
#tools{flex:1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}#tools>*{padding:5px 12px;font-size:13px}#tools button{font-weight:600}
#max{width:92px}#ships[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* the status is written in capitals by the script: here it is a quiet readout, so it is set in lower case with a capital first */
#stat{margin:10px 0 8px;font:12px/1.4 var(--mono);color:var(--muted);text-transform:lowercase}#stat::first-letter{text-transform:uppercase}
#tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:92px}
.tile{position:relative;width:104px;padding:9px 6px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;background:var(--card);animation:rise .25s ease-out both}
.tile .lg{width:34px;height:34px;display:grid;place-items:center;font-size:13px;font-weight:600;border-radius:8px;overflow:hidden;background:#fff;color:#2e2a25}
.tile .lg img{max-width:100%;max-height:100%}
.tile .nm{font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile .st{font:11px var(--mono);color:var(--muted)}
.tile.reading::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--c) 35%,color-mix(in srgb,var(--ink) 10%,transparent) 0) 0 0/300% 100%;animation:slide 1.1s linear infinite}
.tile.ok .st{color:var(--green);font-weight:600}
.tile.bad{opacity:.55}.tile.bad .st{color:var(--bad)}
.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
@keyframes slide{from{background-position:100% 0}to{background-position:-50% 0}}
/* ?shots: while the sites are read each tile is a browser window: the address, the page's title from the web search, then the page as
   Context.dev rendered it and what came out of it. When the search is over the windows shrink back to the strip */
.tile .url,.tile .view{display:none}
#tiles.live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}#tiles.live+#tape{display:none}
#tiles.live .tile{width:auto;padding:8px 8px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 7px;overflow:hidden;text-align:left}
#tiles.live .tile.bad{opacity:.75}#tiles.live .tile .lg{width:20px;height:20px;font-size:9px;border-radius:5px}
#tiles.live .tile .url{display:block;grid-column:1/-1;padding:3px 9px;font:10px/1.5 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
#tiles.live .tile .view{display:grid;place-items:center;position:relative;grid-column:1/-1;margin:0 -8px;padding:12px;aspect-ratio:16/9;overflow:hidden;border-top:1px solid var(--line);background:var(--tile);font-size:12px;line-height:1.35;color:var(--muted);text-align:center}
#tiles.live .tile .view.txt{place-items:start;text-align:left;font:8px/1.35 var(--mono);overflow-wrap:anywhere}
#tiles.live .tile .view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transform-origin:50% 30%;animation:fade .5s ease-out both,pan 16s ease-in-out .5s infinite alternate}
#tiles.live .tile .view[data-cap]::after{content:attr(data-cap);position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:2px 9px;font:600 11px/1.5 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 3px rgba(40,30,20,.1)}
#tiles.live .tile.bad .view[data-cap]::after{color:var(--bad)}#tiles.live .tile.reading::after{left:0;right:0;bottom:0;border-radius:0}
@keyframes fade{from{opacity:0}}@keyframes pan{to{transform:scale(1.6)}}
#tape{--c:var(--ink);display:grid;grid-template-columns:170px minmax(0,1fr) 140px 210px;align-items:center;gap:16px;height:84px;margin-top:12px;padding:10px 18px;overflow:hidden;border-radius:var(--radius)}
#tape .who{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:600}
#tape .lg{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;overflow:hidden;background:#fff;color:#2e2a25;font-size:11px}
#tape .lg img{max-width:100%;max-height:100%}
#tape .mess{height:64px;overflow:hidden;overflow-wrap:anywhere;font:10px/1.3 var(--mono);color:var(--muted);-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
#tape .mess p{margin:0}#tape.run .mess p{animation:scroll 1.6s linear both}
#tape .arr{display:flex;flex-direction:column;align-items:center;font:11px var(--mono);letter-spacing:.06em;color:var(--muted)}
#tape .arr i{width:100%;height:3px;margin:5px 0;border-radius:2px;background:var(--c)}
#tape.run .arr i{background:linear-gradient(90deg,var(--c) 35%,color-mix(in srgb,var(--ink) 10%,transparent) 0) 0 0/300% 100%;animation:slide .7s linear infinite}
#tape .out{text-align:right;line-height:1.25;text-transform:lowercase}#tape .out b{display:block;font:600 20px var(--mono)}#tape .out span{font:11px var(--mono);color:var(--muted)}
#tape.run .out{animation:land .35s .9s ease-out both}
@keyframes scroll{from{transform:translateY(30px)}to{transform:translateY(calc(42px - 100%))}}@keyframes land{from{opacity:0;transform:translateY(4px)}}
#over{margin-top:14px;padding:7px 16px;font-size:13px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
#theme{position:fixed;left:20px;bottom:20px;z-index:35;width:36px;height:36px;border-radius:50%;font-size:15px;box-shadow:0 2px 8px rgba(40,30,20,.12)}
#say{margin:12px 0 0;max-width:820px;font-size:15px}
/* THE LINE: Albert's price line, his own CSS (web/css/line.css). Here it shows tag prices only, so his tag/all-in switch is hidden */
#line.ln{margin:18px 0 0 calc((100% - var(--log) - var(--board))/2)} /* his line.css zeroes #line.ln margins */#line .ln-switch{display:none}
#line:not([data-ln-phase=start]) .ln-labs{display:none} /* his note under the axis promises all-in costs: only his start note stays */
/* his flags (his sheet.css), scoped to the line so the cards' own .flag chips stay as they are */
#line .flag{position:relative;display:inline-flex;align-items:center;flex:none;line-height:1;vertical-align:-1px}
#line .flag img{display:block;width:14px;height:10px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px var(--hair)}
#line .flag[data-size="18"] img{width:18px;height:13px}#line .flag.is-pending{display:inline-block;width:14px;height:10px}
#line .flag-cc{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.flag-tip{position:fixed;z-index:90;max-width:280px;padding:8px 10px;border-radius:8px;background:var(--ink);color:var(--paper);font:400 12px/1.45 var(--sans);pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s}
body.ll #tiles,body.ll #tape{display:none!important}
/* his "Powered by Context.dev" mark (his base.css) */
:root{--ink-blue:#23406B}:root.dark{--ink-blue:#9DB8E8}
.cd-mark{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font:400 12px/1 var(--sans);color:var(--ink-2);text-decoration:none}
.cd-mark b{font-weight:500;color:var(--ink-blue)}.cd-mark img{width:14px;height:14px;border-radius:3px}
.cd-mark .cd-sq{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ink-blue)}
.cd-mark:hover b{text-decoration:underline;text-underline-offset:3px} /* his live log (web/js/livelog.js) reads the sites out instead */
.flag-tip.on{opacity:1;transform:none}.flag-tip[hidden]{display:none}

#wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:114px;gap:20px 30px;padding:20px 0 80px}
body.home #wall{padding-top:max(36px,calc(21vh - 62px))}
@media(max-width:1100px){#wall{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){#wall{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* no cards: each product stands small on the one board, its cutout and its price under it; only the photo lifts on hover */
.card{position:relative;display:block;width:100%;padding:4px 14px 32px;border:0;border-radius:var(--radius);background:none;text-align:left}
.card img.ph{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(40,30,20,.2));transition:opacity .3s,transform .15s ease}
.card:hover img.ph{transform:translateY(-3px) scale(1.03)}
.card.loading img.ph{opacity:0}
.card .ttl{display:block;max-height:100%;overflow:hidden;font-size:12px;font-weight:600;line-height:1.3;text-align:center;color:var(--ink)}
.card.loading::before{content:"";position:absolute;inset:14px 30% 44px;border:1px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:10px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
/* the price is plain text under the product; only the agent's pick gets a filled label. The site's mark shows on hover */
.price{position:absolute;left:50%;bottom:6px;translate:-50% 0;padding:2px 9px;font:500 11.5px/1.5 var(--mono);white-space:nowrap;color:var(--muted);border-radius:999px}
.card:hover .price,.card:focus-visible .price{color:var(--ink)}
.badge{position:absolute;right:6px;bottom:7px;width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:#2e2a25;overflow:hidden;font:8px var(--mono);opacity:0;transition:opacity .15s}
.card:hover .badge,.card:focus-visible .badge{opacity:1}@media(hover:none){.badge{opacity:1}}
.badge img{max-width:78%;max-height:78%}
.card.best .price{background:var(--accent);color:var(--accent-fg);font-weight:600}.card.best .price::before{content:"Pick · "}
body.home .card{animation:rise .4s ease-out both;animation-delay:calc(var(--i) * 22ms)}

#log{position:fixed;inset:0 0 0 auto;width:330px;z-index:40;overflow-y:auto;padding:16px 16px 40px;background:var(--card);border-left:1px solid var(--line);font:11.5px/1.5 var(--mono);overflow-wrap:anywhere}
#log{display:none!important} /* no receipt: the page is one surface (Robert, 14 Nov). ponytail: still written, delete #log once nobody misses it */
#log::before{content:"Receipt";display:block;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
#log .who{margin-top:10px;font-weight:600;color:var(--muted)}#log .think{color:var(--muted);white-space:pre-wrap}
#log .ok{color:var(--green)}#log .bad{color:var(--bad)}#log .say{font:600 13px/1.4 var(--font);margin:4px 0}
/* the guide (guide/: her own page, in a frame): she stands above the receipt, and this wall is her search */
/* a quiet column: the board's own paper, one hairline, Price Monkey small above the receipt */
#guide{position:fixed;inset:0 0 auto auto;z-index:41;width:var(--log);height:100vh;border:0} /* no line: he stands on the board's own paper */
body:not(.guide) #guide{visibility:hidden}

<script type=module>
const $=s=>document.querySelector(s),wall=$('#wall'),stat=$('#stat'),sayEl=$('#say'),log=$('#log'),qEl=$('#q'),drop=$('#drop'),panel=$('#panel'),tiles=$('#tiles'),tabs=$('#tabs'),dlg=$('#dlg');
const KINDS={all:'ALL',used:'USED',refurbished:'REFURBISHED',new:'NEW'};
const SORTS={'':'⇅ Best first',asc:'↑ Cheapest first',desc:'↓ Priciest first'},POPULAR=['iphone 15','espresso machine','vespa','record player','road bike','playstation 5'];
const SHIPS=/ship|deliver|post|versand|liefer|verzend|bezorg|livraison|exp[ée]di|spedizion|env[ií]o|toimitu|frakt|levering|wysy[łl]/i; // ponytail: word list on the page's own delivery text; ask the extractor for a yes/no field if it misses too much

// ?shots: the window wall. Context.dev also returns a picture of every page it reads; each read then takes about 7 s longer (measured), so it is a switch
const LIVE=new URLSearchParams(location.search).has('shots'),HOLD_MS=2500; // how long the windows stand after the last card has landed
let run=0,searching=false,request='',items={},n=0,queue=[],advice=null,think={},reads={},credits=0,t0=0,took=0;
let tapeQ=[],tapeBusy=false,chars=0,picks={}; // picks: the guide's choice, offer id -> why, best first
let checks={}; // listing URL -> what the red-flag check found on that listing's own page (../redflags.py); done:false while it is read
const CHECK_ASK=10; // the lowest prices offered for checking: the server reads the first 3 that have a real listing page (wall.py)
let bananas={}; // offer id -> {n: 1..3 bananas, under: how far under the middle price}: how good the offer is (../bananas.py)
const NANAS=['','Good offer','Great offer','Excellent offer'];
let finding='',kind='all',site='',sort='',brands={},byDomain={},shelf=[],rows=[],sel=-1,ai=false,thread=[],waiting=false,askSeq=0;
const flag=cc=>/^[A-Z]{2}$/.test(cc)?String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt())):'';
const money=o=>Math.round(o.price).toLocaleString('en')+' '+o.currency;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function line(cls,text){const d=log.appendChild(el('div',cls,text));log.scrollTop=log.scrollHeight;return d}

// what this browser remembers about you: only here, sent along so the agent can personalise
function mem(){try{const m=JSON.parse(localStorage.getItem('agora')||'{}');return{s:Array.isArray(m.s)?m.s:[],o:Array.isArray(m.o)?m.o:[]}}catch{return{s:[],o:[]}}}
function remember(key,text){const m=mem();m[key]=[text,...m[key].filter(x=>x!==text)].slice(0,8);try{localStorage.setItem('agora',JSON.stringify(m))}catch{}}
function about(){const m=mem();return((m.s.length?'Earlier searches: '+m.s.join('; ')+'. ':'')+(m.o.length?'Offers they opened: '+m.o.slice(0,4).join('; ')+'.':'')).slice(0,400)}

const brand=s=>brands[s]||byDomain[s]||byDomain[s.split('.').slice(-2).join('.')];
const siteColor=s=>{const c=brand(s)?.color;return c&&!/^#ask.f.f.$/i.test(c)?c:'var(--ink)'}; // a white brand colour would vanish on white
function logo(box,s){ // known site: Context.dev brand logo. Found a minute ago: the site's own favicon, else its initials
  const br=brand(s),i=new Image();i.alt='';i.onerror=()=>{i.remove();box.textContent=s.slice(0,2).toUpperCase()};
  i.src=br?.logo||(s.includes('.')?'https://'+s+'/favicon.ico':'');if(i.src)box.append(i);else i.onerror();box.title=br?.name||s}
function badge(s){const b=el('span','badge');logo(b,s);return b}
function card(o,src,i){
  const c=el('button','card loading'+(i%4==2?' tall':''));c.type='button';c.style.setProperty('--i',i);
  c.setAttribute('aria-label',label(o));
  const img=new Image();img.className='ph';img.alt='';img.onload=img.onerror=ev=>{c.classList.remove('loading');loading--;pump();if(!searching&&Object.keys(items).length)head();
    if(ev.type==='error')img.replaceWith(el('span','ttl',o.title))}; // no usable photo: the title stands in for it
  c.dataset.src=src;
  c.append(img,el('span','price',money(o)+' '+flag(o.country)),badge(o.site));return c}

const LOADS=6;let loading=0;
function pump(){ // photos load a few at a time, top of the wall first; cards you filtered away wait
  for(const c of wall.children){if(loading>=LOADS)return;if(c.hidden||!c.dataset.src)continue;
    loading++;c.querySelector('img.ph').src=c.dataset.src;delete c.dataset.src}}
function details(o,src){
  const b=$('#dbody');b.textContent='';const pic=el('div','pic');const img=new Image();img.src=src;img.alt=o.title;pic.append(img);
  const t=el('div');t.append(el('h2','',o.title),el('p','big',money(o)+(o.eur&&o.currency!='EUR'?' ≈ '+o.eur.toLocaleString('en')+' EUR':'')));
  t.append(el('p','',[o.kind&&o.kind.toUpperCase(),brand(o.site)?.name||o.site,o.country&&o.country+' '+flag(o.country)].filter(Boolean).join(' · ')));
  if('delivery'in o)t.append(el('p','',o.delivery?'Delivery: '+o.delivery:'Delivery: not stated on the page'));
  if(o.location)t.append(el('p','',o.location));
  const c=checks[o.url];if(c?.done&&c.flags&&(c.flags.length||c.read)){ // evidence, never "safe"
    const p=el('p','chk'+(c.flags.length?' bad':''),c.flags.length?'Could be a scam. '+(c.read?'On the listing page: ':'The listing page could not be read; from the search page and the photo: ')+c.flags.map(g=>g.text+' ('+Math.round(g.sure*100)+'% sure)').join('; ')+'.':'Listing page checked: no red flags found. That is not a guarantee.');
    if(c.under>=.25)p.textContent+=' '+Math.round(c.under*100)+'% under the middle price here.';t.append(p)}
  const nn=!c?.flags?.length&&bananas[o.id];if(nn){const p=el('p','chk');p.append(nanas(nn.n),' '+NANAS[nn.n]+': '+Math.round(nn.under*100)+'% under the middle price here. Judged from the title and the price.');t.append(p)}
  const a=el('a','btn','Open listing');a.href=o.url;a.target='_blank';a.rel='noopener';t.append(a);b.append(pic,t);dlg.showModal();remember('o',o.title.slice(0,60))}
$('#dclose').onclick=()=>dlg.close();dlg.onclick=ev=>{if(ev.target===dlg)dlg.close()};

function add(o){
  const src='/cut?u='+encodeURIComponent(o.image),it=card(o,src,n);it.onclick=()=>details(o,src);
  wall.append(it);items[o.id]={o,it,n:n++};lineOffer(o);apply();if(sort||Object.keys(picks).length)order();
  const from=reads[o.site]?.tile?.getBoundingClientRect(),to=it.getBoundingClientRect(); // fly out of the site's tile
  if(from&&!it.hidden&&it.animate)it.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(.25)`,opacity:.2},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'})}
function apply(){ // filters, counts, the agent's pick
  const hide=new Set(advice?advice.hide:[]),cnt={all:0,used:0,refurbished:0,new:0};

async function send(text){ // one message to the assistant; the answer streams into the last bubble
  const before=thread.map(t=>t.me?{role:'user',content:t.me}:{role:'assistant',content:t.a}),seq=++askSeq;
  thread=[...thread,{me:text},{a:''}];qEl.value='';waiting=true;render();
  const put=a=>{if(seq===askSeq){thread=[...thread.slice(0,-1),{a}];render()}};let said='';
  try{await stream('/chat',{q:text,messages:before,offers:Object.values(items).map(x=>x.o)},()=>seq===askSeq,
      e=>{if(e.type==='think'){said+=e.delta;put(said)}else if(e.type==='error')put(said+'\nThat did not work: '+e.text)})}
  catch(err){put(said+'\nThat did not work: '+err.message)}
  if(seq===askSeq){waiting=false;render()}}
function setMode(on){ai=on;document.body.classList.toggle('ai',on);qEl.placeholder=on?'Tell the assistant what you need':FIND;qEl.focus();open()}
for(const b of $('#mode').children){b.onmousedown=ev=>ev.preventDefault();b.onclick=()=>setMode(b.dataset.m==='ai')}
function open(){document.body.classList.add('focus');panel.hidden=false;$('#dim').hidden=false;sel=-1;render()}
function close(){document.body.classList.remove('focus');panel.hidden=true;$('#dim').hidden=true;sel=-1}
qEl.onfocus=open;qEl.onblur=()=>{if(!ai)close()}; // the assistant stays open over the results until you search, press Escape or click outside
$('#dim').onclick=close;qEl.oninput=()=>{sel=-1;if(panel.hidden)open();else if(!ai)render();else $('#clear').hidden=!qEl.value};
$('#clear').onmousedown=ev=>ev.preventDefault();$('#clear').onclick=()=>{qEl.value='';render();qEl.focus()};
qEl.onkeydown=ev=>{
  if(!ai&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){ev.preventDefault();if(panel.hidden)open();
    sel=ev.key==='ArrowDown'?(sel+1>=rows.length?-1:sel+1):(sel<0?rows.length-1:sel-1);render()}
  else if(ev.key==='Escape'){close();qEl.blur()}};
$('#ask').onsubmit=ev=>{ev.preventDefault();const text=qEl.value.trim();
  if(ai){const want=!waiting&&thread.at(-1)?.a?wanted(thread.at(-1).a):'';if(text)send(text.slice(0,300));else if(want)go(want,true)} // Enter on an empty bar runs the search the assistant proposed
  else{const t=rows[sel]||text;if(t)go(t)}};
const FIND='An espresso machine, a used iPhone, a road bike…';qEl.placeholder=FIND;render();
for(const t of ['Used espresso machine','iPhone 15, used','Road bike under 500 euro']){const b=el('button','',t);b.type='button';b.onclick=()=>go(t);$('#chips').append(b)}

// start page: real products the same engine found (shelf.py), and the sites' logos from Context.dev's Brand API (brands.py)
const get=u=>fetch(u).then(r=>r.ok?r.json():null).catch(err=>{console.warn(u,'not loaded',err);return null});
Promise.all([get('/shelf/brands.json'),get('/shelf/shelf.json')]).then(([b,s])=>{
  brands=b&&typeof b==='object'?b:{};byDomain=Object.fromEntries(Object.values(brands).filter(v=>v?.domain).map(v=>[v.domain.replace(/^www\./,''),v]));shelf=Array.isArray(s)?[...s].sort(()=>Math.random()-.5):[];
});  // the start screen's products are his shelf now, on the line (web/assets/shelf.json); ours still feed the suggestions
</script>
</body></html>
